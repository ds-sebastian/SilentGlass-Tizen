name: Offline checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "6.0.x"
      - name: Build the Home Assistant bridge (setup-page test uses it)
        run: dotnet build devices/s90d/device/ha-bridge/src/HaBridge.csproj -c Release -o .local/ha-bridge-test
      - name: Python tests and recipe syntax
        run: python3 -m unittest discover -s tests -v
      - name: Test native catalog logic without Samsung references
        run: dotnet run --project tests/CatalogTests.csproj -- launcher/assets/apps.json
