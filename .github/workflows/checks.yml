name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the Home Assistant bridge (the setup-page test runs it)
        run: python3 tools/build.py bridge
      - name: Tests (they also build and run the C# checks, the screen simulation and the notification harness)
        run: |
          pip install notifications-android-tv==0.1.5 qrcode==8.2
          python3 -m unittest discover -s tests -v
