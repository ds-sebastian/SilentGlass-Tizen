name: Offline checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Build the Home Assistant bridge (setup-page test uses it)
        run: python3 tools/build.py bridge
      - name: The committed bridge installer is this source, byte for byte
        run: |
          python3 tools/bridge_installer.py .local/build/ha-bridge
          git diff --exit-code devices/s90d/device/ha-bridge/ha-bridge-install.sh
      - name: Home Assistant's notification client and the bridge's reader (notice test uses them)
        run: |
          pip install notifications-android-tv==0.1.5
          dotnet build tests/notice-harness/NoticeHarness.csproj -c Release -o .local/notice-harness
      - name: Python tests and recipe syntax
        run: python3 -m unittest discover -s tests -v
      - name: Test native catalog logic without Samsung references
        run: dotnet run --project tests/CatalogTests.csproj -- launcher/assets/apps.json
