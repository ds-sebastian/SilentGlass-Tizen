# Home Assistant automation for the bridge's Power switch. The TV-side bridge runs as an ordinary user and cannot
# press Power; Home Assistant's Samsung integration can (it holds the TV's trusted remote-control token).
# Add to automations.yaml (or create it in the UI), then reload automations. Adjust the remote entity to yours.
- id: silentglass_tv_power
  alias: Living Room TV - power switch (SilentGlass bridge)
  triggers:
  - trigger: mqtt
    topic: silentglass/s90d/power/set
  conditions:
  - condition: template
    value_template: '{{ trigger.payload in [''ON'', ''OFF''] and (trigger.payload == ''ON'') != is_state(''switch.living_room_tv_power'', ''on'') }}'
  actions:
  - action: remote.send_command
    target:
      entity_id: remote.living_room_tv
    data:
      command: KEY_POWER
  mode: single
